<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Music Player</title>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/web_favicon_1.jpg"
    />
    <link
      rel="icon"
      type="image/jpg"
      sizes="32x32"
      href="images/web_favicon_1.jpg"
    />
    <link
      rel="icon"
      type="image/jpg"
      sizes="16x16"
      href="images/web_favicon_1.jpg"
    />
  </head>

  <body>
    <div class="container">
      <div class="article-info">
        <h1 id="title">Music Player</h1>
        <img
          src="images/vinyl-record-cover.jpg"
          alt=""
          id="vinyl-record"
          class="vinyl-record-style"
        />
        <p><span>song name:</span> <span id="song-name"></span></p>
        <p><span>artist name:</span> <span id="artist-name"></span></p>
      </div>

      <div class="progress-container">
        <span id="current-time">00:00</span>
        <input
          id="progress-bar"
          type="range"
          ,
          value="0"
          ,
          min="0"
          ,
          max="100"
        />
        <span id="duration-time">00:00</span>
      </div>

      <div class="btn-control">
        <button id="repeat-btn" title="Repeat OFF">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-repeat-off preview-icon"
          >
            <path d="M11.656 6H21l-4-4" />
            <path d="M17.898 17.898A4 4 0 0 1 17 18H3l4-4" />
            <path d="m2 2 20 20" />
            <path d="M21 13v1a4 4 0 0 1-.171 1.159" />
            <path d="m21 6-4 4" />
            <path d="M3 11v-1a4 4 0 0 1 3.102-3.898" />
            <path d="m7 22-4-4" />
          </svg>
        </button>

        <button id="previous-btn" title="Previous Song">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-step-back-icon lucide-step-back"
          >
            <path
              d="M13.971 4.285A2 2 0 0 1 17 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"
            />
            <path d="M21 20V4" />
          </svg>
        </button>

        <button id="play-pause-btn" title="Pause Song">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-play-icon lucide-play"
          >
            <path
              d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
            />
          </svg>
        </button>

        <button id="next-btn" title="Next Song">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-step-forward-icon lucide-step-forward"
          >
            <path
              d="M10.029 4.285A2 2 0 0 0 7 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"
            />
            <path d="M3 4v16" />
          </svg>
        </button>

        <button id="shuffle-btn" title="Shuffle OFF">
          <!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
          <svg
            width="24px"
            height="24px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4 4L9.5 9.5M14.5 14.5L21 21M21 21H16M21 21V16M4 20L21 3"
              stroke="#000000"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <div class="playlist">
        <h2>playlist</h2>
        <ul id="music-list"></ul>
      </div>

      <div class="song-info">
        <p><span>status</span> <span id="status-song">nothing</span></p>
        <p><span>song</span> <span id="current-song">nothing</span></p>
        <p><span>repeat</span> <span id="repeat-song">OFF</span></p>
        <p><span>shuffle</span> <span id="shuffle-song">OFF</span></p>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 DK. All Rights Reserved</p>
      <p>Created By <a href="mailto:dside1272@gmail.com">Dark Knight</a></p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
